name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: gofmt check
        run: |
          FILES=$(gofmt -l ./internal/ ./cmd/)
          if [ -n "$FILES" ]; then
            echo "gofmt violations:"
            echo "$FILES"
            exit 1
          fi
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          staticcheck ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: gosec (advisory)
        continue-on-error: true
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.9
          "$(go env GOPATH)/bin/gosec" -tests=false ./cmd/... ./internal/...
      - name: build
        run: go build -ldflags "-X github.com/jmrGrav/mcp-hugo-server-go/internal/buildinfo.Version=${GITHUB_REF_NAME:-dev} -X github.com/jmrGrav/mcp-hugo-server-go/internal/buildinfo.Commit=${GITHUB_SHA::12} -X github.com/jmrGrav/mcp-hugo-server-go/internal/buildinfo.BuildChannel=${GITHUB_REF_NAME:-dev}" ./...
      - name: README release policy gate
        run: go run ./cmd/check-readme-release
      - name: oauth-clients registry lint
        run: bash scripts/lint-registry.sh docs/oauth-clients.example.yaml
      - run: go test -cover -coverprofile=coverage.out ./internal/...
      - run: go test -race ./...
      - run: go vet ./...
      - name: Coverage gate
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${COVERAGE}%"
          awk -v cov="$COVERAGE" 'BEGIN { if (cov + 0 < 85) { print "Coverage " cov "% is below 85%"; exit 1 } }'

  source-loc:
    name: Production Go LOC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Verify exclusions
        run: make check-loc-badge
      - name: Generate Shields endpoint payload
        run: make source-loc-badge BADGE_JSON=source-loc.json
      - name: Upload badge payload
        uses: actions/upload-artifact@v4
        with:
          name: source-loc-badge
          path: source-loc.json
          if-no-files-found: error
          retention-days: 1

  publish-source-loc:
    name: Publish Production Go LOC badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: source-loc
    runs-on: ubuntu-latest
    concurrency:
      group: production-go-loc-badge
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: source-loc-badge
          path: /tmp/source-loc-badge
      - name: Publish payload to badges branch
        run: |
          set -euo pipefail
          current_main=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [[ "${current_main}" != "$GITHUB_SHA" ]]; then
            echo "Skipping superseded badge payload for $GITHUB_SHA"
            exit 0
          fi
          parent=()
          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git fetch --depth=1 origin badges
            if git cat-file -e FETCH_HEAD:source-loc.json 2>/dev/null && \
               cmp -s /tmp/source-loc-badge/source-loc.json <(git show FETCH_HEAD:source-loc.json); then
              echo "Badge payload is unchanged"
              exit 0
            fi
            parent=(-p FETCH_HEAD)
          fi
          blob=$(git hash-object -w /tmp/source-loc-badge/source-loc.json)
          tree=$(printf '100644 blob %s\tsource-loc.json\n' "$blob" | git mktree)
          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf 'chore: update production Go LOC badge\n' | git commit-tree "$tree" "${parent[@]}")
          git push origin "$commit:refs/heads/badges"

  # Boot the real binary with a synthetic config and assert all 7 IsItAgentReady
  # discovery endpoints respond correctly, and that scopes_supported contains
  # exactly read/write (#450) and none of the pre-#450 scope strings. This
  # catches "compiles but panics on start" regressions and scope collapse
  # regressions before any code reaches production.
  boot-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Build binary
        run: go build -ldflags "-X github.com/jmrGrav/mcp-hugo-server-go/internal/buildinfo.Version=${GITHUB_REF_NAME:-dev} -X github.com/jmrGrav/mcp-hugo-server-go/internal/buildinfo.Commit=${GITHUB_SHA::12} -X github.com/jmrGrav/mcp-hugo-server-go/internal/buildinfo.BuildChannel=${GITHUB_REF_NAME:-dev}" -o /tmp/mcp-server ./cmd/mcp-hugo-server-go/
      - name: Create test config and registry
        run: |
          mkdir -p /tmp/boot-check/site
          echo '# auth' > /tmp/boot-check/site/auth.md

          cat > /tmp/boot-check/registry.yaml <<'YAML'
          clients:
            - client_id: claude-admin
              client_secret: boot-check-secret-long-enough-value
              redirect_uris:
                - https://claude.ai/api/mcp/auth_callback
              scope: write
            - client_id: chatgpt-write
              client_secret: boot-check-secret-long-enough-value
              redirect_uris:
                - https://chatgpt.com/connector/oauth/*
              # Deliberately kept as the pre-#450 legacy scope string here
              # (not "write") to prove oauth.CanonicalScope's config-time
              # aliasing still resolves an un-migrated yaml entry correctly.
              scope: content.write
          YAML

          cat > /tmp/boot-check/config.yaml <<'YAML'
          site_root: /tmp/boot-check/site
          site_url: https://www.example.com
          site_name: boot-check
          http_bind_addr: 127.0.0.1
          http_bind_port: 8765
          streaming_enabled: true
          transport: http
          oauth:
            enabled: true
            issuer: http://127.0.0.1:8765
            resource: http://127.0.0.1:8765/mcp
            dynamic_client_enabled: true
            auth_code_ttl_seconds: 300
            access_token_ttl_seconds: 3600
            trusted_authorize_cidrs:
              - 127.0.0.1/32
            client_registry_path: /tmp/boot-check/registry.yaml
          YAML
      - name: Start server and wait for ready
        run: |
          MCP_HUGO_SERVER_CONFIG=/tmp/boot-check/config.yaml /tmp/mcp-server &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> "$GITHUB_ENV"
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8765/.well-known/oauth-authorization-server > /dev/null 2>&1; then
              echo "Server ready after ${i} attempts"
              break
            fi
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8765/.well-known/oauth-authorization-server > /dev/null || \
            { echo "Server failed to start"; kill $SERVER_PID 2>/dev/null; exit 1; }
      - name: IsItAgentReady — 7 discovery endpoints
        run: |
          BASE=http://127.0.0.1:8765
          fail=0
          check() {
            local desc="$1" url="$2" want="$3"
            local got
            got=$(curl -so /dev/null -w '%{http_code}' "$url")
            if [[ "$got" == "$want" ]]; then
              echo "OK   $desc ($got)"
            else
              echo "FAIL $desc: got $got want $want" >&2
              fail=1
            fi
          }
          check "OAuth authorization server" "$BASE/.well-known/oauth-authorization-server" "200"
          check "OAuth protected resource"   "$BASE/.well-known/oauth-protected-resource"   "200"
          check "MCP server card"            "$BASE/.well-known/mcp/server-card.json"        "200"
          check "API catalog (mcp.json)"     "$BASE/.well-known/mcp.json"                    "200"
          check "Agent skills index"         "$BASE/.well-known/agent.json"                  "200"
          check "auth.md"                    "$BASE/auth.md"                                 "200"
          # /mcp with OAuth enabled → 401 challenge (correct behaviour)
          check "MCP endpoint (401=correct)" "$BASE/mcp"                                     "401"
          [[ $fail -eq 0 ]] || exit 1
      - name: scopes_supported — read/write present, pre-#450 scopes absent
        run: |
          SCOPES=$(curl -sf http://127.0.0.1:8765/.well-known/oauth-authorization-server | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(' '.join(d.get('scopes_supported',[])))")
          echo "scopes_supported: $SCOPES"
          for legacy in reader content.read content.write site.admin system.admin; do
            if echo "$SCOPES" | grep -qw "$legacy"; then
              echo "FAIL scopes_supported must not contain legacy scope '$legacy' (scope collapse regression, #450)" >&2
              exit 1
            fi
          done
          echo "OK   no pre-#450 legacy scopes advertised"
          for want in read write; do
            if ! echo "$SCOPES" | grep -qw "$want"; then
              echo "FAIL scopes_supported must contain '$want'" >&2
              exit 1
            fi
          done
          echo "OK   read and write present in scopes_supported"
      - name: Scope clamping — claude-admin requesting legacy scope tokens gets code not error
        run: |
          VERIFIER="boot-check-verifier-long-enough-value"
          CHALLENGE=$(printf '%s' "$VERIFIER" | openssl dgst -sha256 -binary | openssl base64 | tr '+/' '-_' | tr -d '=')
          # Deliberately requests the full pre-#450 legacy scope list (not
          # "read write") to prove oauth.CanonicalScope's request-time
          # aliasing still resolves an old/cached scope string correctly —
          # this is the exact mechanism the #448/#449 outage broke.
          PARAMS="response_type=code&client_id=claude-admin&redirect_uri=https%3A%2F%2Fclaude.ai%2Fapi%2Fmcp%2Fauth_callback&state=boot&scope=reader+content.read+content.write+site.admin+system.admin&code_challenge=${CHALLENGE}&code_challenge_method=S256"
          LOC=$(curl -sk -o /dev/null -w '%{redirect_url}' "http://127.0.0.1:8765/authorize?${PARAMS}")
          echo "Location: $LOC"
          if echo "$LOC" | grep -q "error="; then
            echo "FAIL authorize returned error in Location (legacy scope aliasing broken)" >&2
            exit 1
          fi
          if ! echo "$LOC" | grep -q "code="; then
            echo "FAIL authorize Location missing code" >&2
            exit 1
          fi
          echo "OK   legacy scope tokens resolved — code issued, no error"
      - name: Agent-ready shell smoke matches canonical scope contract
        run: bash scripts/test-check-agent-ready.sh
      - name: Agent-ready www reference surface stays coherent
        run: bash scripts/test-agent-ready-www-surface.sh
      - name: Deploy-integrity smoke rejects homepage fallbacks
        run: bash scripts/test-smoke-deploy-integrity.sh
      - name: Stop server
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true

  staging-smoke-local:
    name: Staging smoke (local synthetic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Run secret-free staging smoke
        env:
          MCP_SMOKE_DELAY: "1"
        run: bash scripts/staging-smoke-local.sh

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trufflehog:
    name: Secret Scan (trufflehog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: trufflehog scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified
